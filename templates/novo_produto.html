<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Novo Produto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f3ed;
        }

        h1 {
            color: #8B4A00;
        }

        .formulario {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .botoes {
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-salvar {
            background-color: #8B4A00;
            color: white;
        }

        .btn-salvar:hover {
            background-color: #A85C00;
        }

        .btn-voltar {
            background-color: #ddd;
            color: #333;
            margin-left: 10px;
        }

        .btn-voltar:hover {
            background-color: #ccc;
        }
    </style>
</head>

<body>

    <h1>📦 Novo Produto</h1>

    <div class="formulario">

        <form action="/produtos/novo" method="post">

            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Digite a descrição do produto" required></textarea>

            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="0,00" required>

            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" name="estoque" min="0" placeholder="Quantidade em estoque" required>

            <div class="botoes">
                <button type="submit" class="btn btn-salvar">
                    💾 Cadastrar Produto
                </button>

                <a href="/produtos" class="btn btn-voltar">
                    ← Voltar
                </a>
            </div>

        </form>

    </div>

</body>

</html>
