<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Pagamento - Queridin DI MINAS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .topo {
            background: #8B4A00;
            color: white;
            padding: 30px;
        }

        .topo h2 {
            margin: 0;
        }

        .conteudo {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #8B4A00;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .botoes {
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            background: #8B4A00;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .cancelar {
            background: #777;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>Queridin DI MINAS</h2>
    </div>

    <div class="conteudo">

        <div class="card">

            <h1>Novo Pagamento</h1>

            <form action="/novo_pagamento" method="post">

                <div class="campo">
                    <label for="colaborador_id">Colaborador</label>

                    <select id="colaborador_id" name="colaborador_id" required>
                        <option value="">Selecione o colaborador</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>

                    <input type="number" id="valor" name="valor" step="0.01" min="0" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="data_pagamento">Data do pagamento</label>

                    <input type="date" id="data_pagamento" name="data_pagamento" required>
                </div>

                <div class="campo">
                    <label for="forma_pagamento">Forma de pagamento</label>

                    <select id="forma_pagamento" name="forma_pagamento">
                        <option value="PIX">PIX</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="observacao">Observação</label>

                    <textarea id="observacao" name="observacao"
                        placeholder="Digite uma observação, se necessário"></textarea>
                </div>

                <div class="botoes">

                    <button type="submit" class="botao">
                        Salvar Pagamento
                    </button>

                    <a href="/pagamentos" class="botao cancelar">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>
    <script>
        async function carregarColaboradores() {

            const resposta = await fetch("/api/colaboradores");
            const colaboradores = await resposta.json();

            const select = document.getElementById("colaborador_id");

            colaboradores.forEach(colaborador => {

                const opcao = document.createElement("option");

                opcao.value = colaborador.id;
                opcao.textContent = colaborador.nome;

                select.appendChild(opcao);
            });
        }

        carregarColaboradores();
    </script>
</body>

</html>
