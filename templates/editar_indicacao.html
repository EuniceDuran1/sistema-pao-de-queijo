<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Indicação - Queridin DI MINAS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .topo {
            background: #8B4A00;
            color: white;
            padding: 30px;
        }

        .topo h2 {
            margin: 0;
        }

        .conteudo {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 900px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #8B4A00;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input,
        .campo select,
        .campo textarea {

            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .campo textarea {
            min-height: 100px;
            resize: vertical;
        }

        .botoes {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .botao {
            display: inline-block;
            background: #8B4A00;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .botao:hover {
            background: #6f3a00;
        }

        .voltar {
            background: #777;
        }

        .voltar:hover {
            background: #555;
        }
    </style>

</head>

<body>

    <div class="topo">

        <h2>Queridin DI MINAS</h2>

    </div>

    <div class="conteudo">

        <div class="card">

            <h1>Editar Indicação</h1>

            <form action="/editar_indicacao/{{ indicacao.id }}" method="post">

                <!-- COLABORADOR -->

                <div class="campo">

                    <label for="colaborador_id">
                        Colaborador
                    </label>

                    <select id="colaborador_id" name="colaborador_id" required>

                        <option value="">
                            Selecione o colaborador
                        </option>

                        {% for colaborador in colaboradores %}

                        <option value="{{ colaborador.id }}" {% if colaborador.id==indicacao.colaborador_id %} selected
                            {% endif %}>

                            {{ colaborador.nome }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- CLIENTE -->

                <div class="campo">

                    <label for="cliente_id">
                        Cliente
                    </label>

                    <select id="cliente_id" name="cliente_id">

                        <option value="">
                            Selecione o cliente
                        </option>

                        {% for cliente in clientes %}

                        <option value="{{ cliente.id }}" {% if cliente.id==indicacao.cliente_id %} selected {% endif %}>

                            {{ cliente.nome }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PRODUTO -->

                <div class="campo">

                    <label for="produto_id">
                        Produto
                    </label>

                    <select id="produto_id" name="produto_id">

                        <option value="">
                            Selecione o produto
                        </option>

                        {% for produto in produtos %}

                        <option value="{{ produto.id }}" {% if produto.id==indicacao.produto_id %} selected {% endif %}>

                            {{ produto.nome }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- DATA -->

                <div class="campo">

                    <label for="data_indicacao">
                        Data da indicação
                    </label>

                    <input type="date" id="data_indicacao" name="data_indicacao"
                        value="{{ indicacao.data_indicacao.strftime('%Y-%m-%d') if indicacao.data_indicacao else '' }}"
                        required>

                </div>


                <!-- SITUAÇÃO -->

                <div class="campo">

                    <label for="situacao">
                        Situação
                    </label>

                    <select id="situacao" name="situacao">

                        <option value="Pendente" {% if indicacao.situacao=="Pendente" %} selected {% endif %}>
                            Pendente
                        </option>

                        <option value="Concluída" {% if indicacao.situacao=="Concluída" %} selected {% endif %}>
                            Concluída
                        </option>

                        <option value="Cancelada" {% if indicacao.situacao=="Cancelada" %} selected {% endif %}>
                            Cancelada
                        </option>

                    </select>

                </div>


                <!-- VALOR -->

                <div class="campo">

                    <label for="valor_indicacao">
                        Valor da indicação
                    </label>

                    <input type="number" id="valor_indicacao" name="valor_indicacao" step="0.01" min="0"
                        value="{{ indicacao.valor_indicacao or '' }}" placeholder="0,00">

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="campo">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea id="observacao" name="observacao"
                        placeholder="Digite uma observação, se necessário.">{{ indicacao.observacao or '' }}</textarea>

                </div>


                <!-- BOTÕES -->

                <div class="botoes">

                    <button class="botao" type="submit">
                        Salvar alterações
                    </button>

                    <a href="/indicacoes" class="botao voltar">
                        Voltar
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
