<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Indicação - Queridin DI MINAS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .topo {
            background: #8B4A00;
            color: white;
            padding: 30px;
        }

        .topo h2 {
            margin: 0;
        }

        .conteudo {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 900px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #8B4A00;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .campo textarea {
            min-height: 100px;
            resize: vertical;
        }

        .botoes {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .botao {
            display: inline-block;
            background: #8B4A00;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .voltar {
            background: #777;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>Queridin DI MINAS</h2>
    </div>

    <div class="conteudo">

        <div class="card">

            <h1>Nova Indicação</h1>

            <form id="form-indicacao" action="/nova_indicacao" method="post">
                <div class="campo">
                    <label for="colaborador_id">Colaborador</label>

                    <select id="colaborador_id" name="colaborador_id" required>
                        <option value="">Selecione o colaborador</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cliente_id">Cliente</label>

                    <select id="cliente_id" name="cliente_id">
                        <option value="">Selecione o cliente</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="produto_id">Produto</label>

                    <select id="produto_id" name="produto_id">
                        <option value="">Selecione o produto</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data_indicacao">Data da indicação</label>

                    <input type="date" id="data_indicacao" name="data_indicacao" required>
                </div>

                <div class="campo">
                    <label for="situacao">Situação</label>

                    <select id="situacao" name="situacao">
                        <option value="Pendente">Pendente</option>
                        <option value="Concluída">Concluída</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="valor_indicacao">Valor da indicação</label>

                    <input type="number" id="valor_indicacao" name="valor_indicacao" step="0.01" min="0"
                        placeholder="0,00">
                </div>

                <div class="campo">
                    <label for="observacao">Observação</label>

                    <textarea id="observacao" name="observacao"
                        placeholder="Digite uma observação, se necessário."></textarea>
                </div>

                <div class="botoes">

                    <button class="botao" type="submit">
                        Salvar indicação
                    </button>

                    <a href="/indicacoes" class="botao voltar">
                        Voltar
                    </a>

                </div>

            </form>

        </div>

    </div>
    <script>

        async function carregarDados() {

            // ==============================
            // CARREGAR COLABORADORES
            // ==============================

            const respostaColaboradores = await fetch("/api/colaboradores");
            const colaboradores = await respostaColaboradores.json();

            const campoColaborador = document.getElementById("colaborador_id");

            colaboradores.forEach(colaborador => {

                const opcao = document.createElement("option");

                opcao.value = colaborador.id;
                opcao.textContent = colaborador.nome;

                campoColaborador.appendChild(opcao);
            });


            // ==============================
            // CARREGAR CLIENTES
            // ==============================

            const respostaClientes = await fetch("/api/clientes");
            const clientes = await respostaClientes.json();

            const campoCliente = document.getElementById("cliente_id");

            clientes.forEach(cliente => {

                const opcao = document.createElement("option");

                opcao.value = cliente.id;
                opcao.textContent = cliente.nome;

                campoCliente.appendChild(opcao);
            });


            // ==============================
            // CARREGAR PRODUTOS
            // ==============================

            const respostaProdutos = await fetch("/api/produtos");
            const produtos = await respostaProdutos.json();

            const campoProduto = document.getElementById("produto_id");

            produtos.forEach(produto => {

                const opcao = document.createElement("option");

                opcao.value = produto.id;
                opcao.textContent = produto.nome;

                campoProduto.appendChild(opcao);
            });


            // ==============================
            // DATA ATUAL
            // ==============================

            const campoData = document.getElementById("data_indicacao");

            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, "0");
            const dia = String(hoje.getDate()).padStart(2, "0");

            campoData.value = `${ano}-${mes}-${dia}`;
        }

        carregarDados();

    </script>
</body>

</html>
