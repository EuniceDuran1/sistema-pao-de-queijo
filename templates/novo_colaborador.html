<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Colaborador - Queridin DI MINAS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .cabecalho {
            background: #8B4A00;
            color: white;
            padding: 20px 30px;
        }

        .conteudo {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #8B4A00;
            margin-top: 0;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .botoes {
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            padding: 12px 20px;
            background: #8B4A00;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .voltar {
            background: #777;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="cabecalho">
        <h2>Queridin DI MINAS</h2>
    </div>

    <div class="conteudo">

        <div class="card">

            <h1>Novo Colaborador</h1>
            <form action="/novo_colaborador" method="post">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo">
                    <label for="chave_pix">Chave PIX</label>
                    <input type="text" id="chave_pix" name="chave_pix">
                </div>

                <div class="campo">
                    <label for="situacao">Situação</label>
                    <select id="situacao" name="situacao">
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>

                <div class="botoes">
                    <button class="botao" type="submit">Salvar</button>

                    <a href="/colaboradores" class="botao voltar">


                        Voltar
                    </a>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
