<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - Sistema Pão de Queijo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f1e7;
            color: #5b2c06;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* MENU LATERAL */
        .sidebar {
            width: 240px;
            background: #8b4a00;
            color: white;
            padding: 30px 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 45px;
        }

        .logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 10px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .menu a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* CONTEÚDO */
        .conteudo {
            flex: 1;
            padding: 40px;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #8b4a00;
        }

        .usuario {
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        /* BOTÃO */
        .botao {
            background: #8b4a00;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .botao:hover {
            background: #6f3b00;
        }

        /* TABELA */
        .tabela-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3e2cf;
            color: #5b2c06;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fffaf4;
        }

        .vazio {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .rodape {
            margin-top: 30px;
            text-align: center;
            color: #8b6b4a;
        }
    </style>
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <img src="/static/img/logo.png" alt="Queridin DI MINAS">
            </div>

            <nav class="menu">

                <a href="/">🏠 Dashboard</a>

                <a href="/produtos">📦 Produtos</a>

                <a href="/pedidos">🛒 Pedidos</a>

                <a href="/clientes">👥 Clientes</a>

                <a href="/estoque">📊 Estoque</a>

                <a href="#">💰 Financeiro</a>

                <a href="#">📈 Relatórios</a>

            </nav>

        </aside>

        <!-- CONTEÚDO -->
        <main class="conteudo">

            <div class="cabecalho">

                <div>
                    <h1>Clientes</h1>
                    <p>Cadastro e consulta de clientes</p>
                </div>

                <div class="usuario">
                    👤 Administrador
                </div>

            </div>

            <button class="botao novo-cliente" onclick="window.location.href='/novo_cliente'">
                ➕ Novo Cliente
            </button>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-clientes">

                        <tr>
                            <td colspan="4" class="vazio">
                                Carregando clientes...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="rodape">
                Sistema Pão de Queijo • Gestão de vendas e estoque
            </div>

        </main>

    </div>

    <script>

        async function carregarClientes() {

            try {

                const resposta = await fetch("/api/clientes");

                const clientes = await resposta.json();

                const tabela = document.getElementById("lista-clientes");

                tabela.innerHTML = "";

                if (clientes.length === 0) {

                    tabela.innerHTML = `
                        <tr>
                            <td colspan="4" class="vazio">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                    `;

                    return;
                }

                clientes.forEach(cliente => {

                    const linha = document.createElement("tr");

                    linha.innerHTML = `
    <td>${cliente.id}</td>
    <td>${cliente.nome}</td>
    <td>${cliente.telefone || "-"}</td>
    <td>${cliente.endereco || "-"}</td>
    <td>
        <button onclick="editarCliente(${cliente.id})">
            ✏️ Editar
        </button>
    </td>
`;

                    tabela.appendChild(linha);

                });

            } catch (erro) {

                console.error("Erro ao carregar clientes:", erro);

                document.getElementById("lista-clientes").innerHTML = `
                    <tr>
                        <td colspan="4" class="vazio">
                            Erro ao carregar clientes.
                        </td>
                    </tr>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", carregarClientes);
        function editarCliente(id) {
            window.location.href = `/editar_cliente/${id}`;
        }
    </script>

</body>

</html>
