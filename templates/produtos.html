<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Produtos - Queridin Di Minas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ed;
            color: #333;
        }

        .cabecalho {
            background: #8B4A00;
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 28px;
        }

        .cabecalho p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .barra-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .busca {
            flex: 1;
            min-width: 250px;
        }

        .busca input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .busca input:focus {
            border-color: #8B4A00;
        }

        .btn-novo {
            display: inline-block;
            background-color: #8B4A00;
            color: white;
            padding: 13px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-novo:hover {
            background-color: #A85C00;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card-produto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-produto:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .imagem-produto {
            width: 100%;
            height: 190px;
            background: #eadbc8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .imagem-produto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .imagem-placeholder {
            font-size: 65px;
        }

        .conteudo-produto {
            padding: 18px;
        }

        .nome-produto {
            font-size: 20px;
            font-weight: bold;
            color: #8B4A00;
            margin-bottom: 8px;
        }

        .descricao {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
            margin-bottom: 15px;
        }

        .preco {
            font-size: 23px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .estoque {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .disponivel {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }

        .indisponivel {
            display: inline-block;
            background: #ffebee;
            color: #c62828;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }

        .acoes {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-editar,
        .btn-excluir {
            flex: 1;
            padding: 9px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-editar {
            background: #f1e1cf;
            color: #8B4A00;
            border: none;
        }

        .btn-editar:hover {
            background: #e5ccb0;
        }

        .btn-excluir {
            background: #ffebee;
            color: #c62828;
            border: none;
        }

        .btn-excluir:hover {
            background: #ffcdd2;
        }

        .carregando,
        .sem-produtos {
            grid-column: 1 / -1;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .rodape {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .cabecalho {
                padding: 20px;
            }

            .container {
                padding: 0 15px;
            }

            .cabecalho h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header class="cabecalho">
        <div>
            <h1>🧀 Catálogo de Produtos</h1>
            <p>Queridin Di Minas - Produtos disponíveis</p>
        </div>
    </header>

    <main class="container">

        <div class="barra-acoes">

            <div class="busca">
                <input type="text" id="campo-busca" placeholder="🔎 Buscar produto..." oninput="filtrarProdutos()">
            </div>

            <a href="/produtos/novo" class="btn-novo">
                ➕ Novo Produto
            </a>

        </div>

        <section id="catalogo" class="catalogo">

            <div class="carregando">
                Carregando produtos...
            </div>

        </section>

    </main>

    <footer class="rodape">
        Sistema de Gestão - Queridin Di Minas
    </footer>


    <script>

        let produtos = [];


        async function carregarProdutos() {

            try {

                const resposta = await fetch("/api/produtos");

                if (!resposta.ok) {
                    throw new Error(
                        "Erro HTTP: " + resposta.status
                    );
                }

                produtos = await resposta.json();

                mostrarProdutos(produtos);

            } catch (erro) {

                console.error(erro);

                document.getElementById("catalogo").innerHTML = `
                    <div class="sem-produtos">
                        ❌ Erro ao carregar os produtos.
                    </div>
                `;
            }
        }


        function mostrarProdutos(lista) {

            const catalogo =
                document.getElementById("catalogo");

            catalogo.innerHTML = "";


            if (lista.length === 0) {

                catalogo.innerHTML = `
                    <div class="sem-produtos">
                        📦 Nenhum produto encontrado.
                    </div>
                `;

                return;
            }


            lista.forEach(function (produto) {

                const card =
                    document.createElement("div");

                card.className = "card-produto";


                const estoque =
                    Number(produto.estoque) || 0;


                const preco =
                    Number(produto.preco) || 0;


                const disponivel =
                    estoque > 0;


                /*
                 * Caso futuramente a API tenha
                 * o campo "imagem", ele será utilizado.
                 * Enquanto isso, aparece o emoji.
                 */

                const imagem = produto.imagem
                    ? `
                        <img
                            src="${produto.imagem}"
                            alt="${produto.nome}"
                        >
                    `
                    : `
                        <div class="imagem-placeholder">
                            🧀
                        </div>
                    `;


                card.innerHTML = `

                    <div class="imagem-produto">
                        ${imagem}
                    </div>


                    <div class="conteudo-produto">

                        <div class="nome-produto">
                            ${produto.nome || "Produto"}
                        </div>


                        <div class="descricao">
                            ${produto.descricao || "Sem descrição cadastrada."}
                        </div>


                        <div class="preco">
                            R$ ${preco
                        .toFixed(2)
                        .replace(".", ",")}
                        </div>


                        <div class="estoque">
                            📦 Estoque:
                            <strong>${estoque}</strong>
                        </div>


                        ${disponivel
                        ?
                        `<span class="disponivel">
                                ● Disponível
                            </span>`
                        :
                        `<span class="indisponivel">
                                ● Indisponível
                            </span>`
                    }


                        <div class="acoes">

                            <a
                                href="/produtos/editar/${produto.id}"
                                class="btn-editar"
                            >
                                ✏️ Editar
                            </a>


                            <button
                                onclick="excluirProduto(${produto.id})"
                                class="btn-excluir"
                            >
                                🗑️ Excluir
                            </button>

                        </div>

                    </div>
                `;


                catalogo.appendChild(card);

            });
        }


        function filtrarProdutos() {

            const termo =
                document
                    .getElementById("campo-busca")
                    .value
                    .toLowerCase();


            const filtrados =
                produtos.filter(function (produto) {

                    const nome =
                        (produto.nome || "")
                            .toLowerCase();

                    const descricao =
                        (produto.descricao || "")
                            .toLowerCase();


                    return (
                        nome.includes(termo) ||
                        descricao.includes(termo)
                    );

                });


            mostrarProdutos(filtrados);
        }


        async function excluirProduto(id) {

            const confirmar = confirm(
                "Tem certeza que deseja excluir este produto?"
            );


            if (!confirmar) {
                return;
            }


            try {

                const resposta = await fetch(
                    `/api/produtos/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                const resultado =
                    await resposta.json();


                if (resultado.erro) {

                    alert(resultado.erro);

                    return;
                }


                if (resultado.mensagem) {

                    alert(resultado.mensagem);

                    carregarProdutos();

                    return;
                }


                alert(
                    "Não foi possível excluir o produto."
                );


            } catch (erro) {

                console.error(erro);

                alert(
                    "Erro ao excluir o produto."
                );

            }

        }


        carregarProdutos();

    </script>

</body>

</html>
