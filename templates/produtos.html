<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Produtos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f3ed;
        }

        h1 {
            color: #8B4A00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #8B4A00;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .preco {
            font-weight: bold;
        }

        .btn-novo {
            display: inline-block;
            background-color: #8B4A00;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-novo:hover {
            background-color: #A85C00;
        }
    </style>

</head>

<body>

    <h1>📦 Produtos</h1>

    <p>Produtos cadastrados no sistema.</p>

    <a href="/produtos/novo" class="btn-novo">
        ➕ Novo Produto
    </a>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody id="lista-produtos">

            <tr>

                <td colspan="6">
                    Carregando produtos...
                </td>

            </tr>

        </tbody>

    </table>


    <script>

        async function carregarProdutos() {

            try {

                const resposta = await fetch("/api/produtos");

                if (!resposta.ok) {

                    throw new Error(
                        "Erro HTTP: " + resposta.status
                    );

                }

                const produtos = await resposta.json();

                const tabela = document.getElementById(
                    "lista-produtos"
                );

                tabela.innerHTML = "";

                produtos.forEach(function (produto) {

                    const linha = document.createElement("tr");

                    linha.innerHTML = `

                        <td>${produto.id}</td>

                        <td>${produto.nome}</td>

                        <td>${produto.descricao}</td>

                        <td class="preco">

                            R$ ${Number(produto.preco)
                            .toFixed(2)
                            .replace(".", ",")}

                        </td>

                        <td>${produto.estoque}</td>

                        <td>

                            <a href="/produtos/editar/${produto.id}">
                                ✏️ Editar
                            </a>

                            <button
                                onclick="excluirProduto(${produto.id})"
                                class="btn-excluir">

                                🗑️ Excluir

                            </button>

                        </td>

                    `;

                    tabela.appendChild(linha);

                });

            } catch (erro) {

                console.error(erro);

                document.getElementById(
                    "lista-produtos"
                ).innerHTML = `

                    <tr>

                        <td colspan="6">
                            Erro ao carregar os produtos.
                        </td>

                    </tr>

                `;

            }

        }


        async function excluirProduto(id) {

            const confirmar = confirm(
                "Tem certeza que deseja excluir este produto?"
            );

            if (!confirmar) {

                return;

            }

            try {

                const resposta = await fetch(
                    `/api/produtos/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                const resultado = await resposta.json();

                if (resultado.erro) {

                    alert(resultado.erro);

                    return;

                }

                if (resultado.mensagem) {

                    alert(resultado.mensagem);

                    carregarProdutos();

                    return;

                }

                alert(
                    "Não foi possível excluir o produto."
                );

            } catch (erro) {

                console.error(erro);

                alert(
                    "Erro ao excluir o produto."
                );

            }

        }


        carregarProdutos();

    </script>

</body>

</html>
